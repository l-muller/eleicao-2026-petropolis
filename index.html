<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petrópolis em votos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Azul e vermelho são reservados para os candidatos. Todo o resto é neutro. */
:root{
  --ink:#0b1b3a; --mut:#5d6b86; --bg:#f4f6fb; --card:#fff; --line:#e3e8f2; --chip:#eaeefb;
  --blue:#2f5bff; --red:#ff3b4e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
.w{max-width:1360px;margin:0 auto;padding:22px 18px 44px}
header{margin-bottom:18px}
h1{font:700 32px/1.05 Sora,system-ui,sans-serif;letter-spacing:-.025em;margin:0}
.sub{margin:6px 0 0;color:var(--mut);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;border-top:4px solid var(--line)}
.kpi.f{border-top-color:var(--blue)} .kpi.l{border-top-color:var(--red)}
.kpi b{display:block;font:700 22px/1.2 Sora,system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.f b{color:var(--blue)} .kpi.l b{color:var(--red)}
.bar-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:14px}
.grp{display:flex;align-items:center;gap:8px;min-width:0}
.grp>label{font-size:12px;color:var(--mut);white-space:nowrap}
.pills{display:flex;gap:3px;background:var(--chip);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%}
.pill{border:0;background:transparent;color:var(--ink);font:500 13px "DM Sans",sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.pill:hover{background:rgba(11,27,58,.08)}
.pill.on{background:var(--ink);color:#fff}
.pill:focus-visible,.it:focus-visible,#q:focus-visible,#ver:focus-visible,.link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#q{font:inherit;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;color:var(--ink);width:190px}
#ver{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:500 13px "DM Sans",sans-serif;color:var(--ink);cursor:pointer}
#ver:hover{border-color:var(--ink)}
.sp{flex:1}
.g{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media(max-width:980px){.g{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0}
.mapwrap{position:relative;padding:8px}
#mapa{height:min(76vh,760px);min-height:460px;border-radius:10px;background:#e9edf5}
.legend{position:absolute;left:20px;bottom:20px;z-index:800;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px rgba(11,27,58,.15);font-size:12px;color:var(--mut);width:220px}
.legend b{display:block;color:var(--ink);font-size:12px;margin-bottom:5px;line-height:1.3}
.legend i.g1{display:block;height:8px;border-radius:99px}
.legend .tk{display:flex;justify-content:space-between;margin-top:3px;font-variant-numeric:tabular-nums}
.legend hr{border:0;border-top:1px solid var(--line);margin:9px 0 8px}
.sz{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.sz div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-variant-numeric:tabular-nums}
.sz i{display:block;border:1.5px solid rgba(11,27,58,.75);border-radius:50%;background:rgba(11,27,58,.12)}
.nota{font-size:12px;color:var(--mut);margin:8px 10px 4px}
.nota.err{color:var(--red)}
.side{position:sticky;top:12px;padding:16px}
@media(max-width:980px){.side{position:static}}
h2{font:700 20px/1.2 Sora,system-ui,sans-serif;letter-spacing:-.015em;margin:0}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.tag{font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.f{background:var(--blue)} .tag.l{background:var(--red)}
.duelo{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.duelo div{display:flex;flex-direction:column}
.duelo div+div{text-align:right}
.duelo b{font:700 28px/1.1 Sora,system-ui,sans-serif;letter-spacing:-.03em}
.duelo span{font-size:12px;color:var(--mut)}
.azul{color:var(--blue)} .verm{color:var(--red)}
.vs{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--red)}
.vs .a{background:var(--blue);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.vs .b{flex:1;background:var(--red)}
.cmp{font-size:13px;margin:10px 0 0;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stats div{background:var(--bg);border-radius:12px;padding:8px 10px}
.stats b{display:block;font:700 15px Sora,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--mut)}
.link{border:0;background:none;color:var(--ink);font:500 13px "DM Sans",sans-serif;text-decoration:underline;cursor:pointer;padding:0;margin-top:6px}
.list{margin-top:14px;max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.it{position:relative;display:flex;justify-content:space-between;gap:8px;padding:8px 6px 11px;cursor:pointer;border-radius:8px;transition:background .15s}
.it:hover,.it.sel{background:var(--bg)}
.it em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.it b{position:absolute;left:6px;bottom:4px;height:3px;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .5s}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 28px rgba(11,27,58,.22)}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 "DM Sans",sans-serif;color:var(--ink);min-width:210px}
.pp h3{font:700 15px Sora,system-ui,sans-serif;margin:0 0 8px}
.pp .pr{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:13px}
.leaflet-tooltip{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:6px 10px;font:500 12px "DM Sans",sans-serif;box-shadow:0 4px 14px rgba(11,27,58,.3)}
.leaflet-tooltip:before{display:none}
@media(max-width:560px){.legend{left:14px;bottom:14px;width:190px}}
</style>
</head>
<body>
<div class="w">
  <header>
    <h1>Petrópolis em votos</h1>
    <p class="sub">A cor de cada bairro mostra onde o Flávio está acima ou abaixo da média da cidade. O tamanho da bolha mostra o peso do bairro em votos.</p>
  </header>

  <div class="kpis" id="tot"></div>

  <div class="bar-ctl">
    <div class="grp"><label>Tamanho da bolha</label><div class="pills" id="pTam"></div></div>
    <div class="grp"><label>Cor do bairro</label><div class="pills" id="pCor"></div></div>
    <span class="sp"></span>
    <input id="q" type="search" placeholder="Buscar bairro" aria-label="Buscar bairro">
    <button id="ver" type="button">Ver tudo</button>
  </div>

  <div class="g">
    <div class="card">
      <div class="mapwrap">
        <div id="mapa"></div>
        <div class="legend">
          <b id="lt"></b><i class="g1" id="lbar"></i>
          <div class="tk"><span id="lmin"></span><span id="lmid"></span><span id="lmax"></span></div>
          <hr>
          <b id="lst"></b><div class="sz" id="lsz"></div>
        </div>
      </div>
      <div class="nota" id="nota"></div>
    </div>
    <aside class="card side"><div id="det"></div><div class="list" id="list"></div></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const ARQ_GEOJSON = 'bairros2025-votos-corr_rows_112.geojson';
const ARQ_XLSX    = 'Mapa por Bairro.xlsx';
const CAMPO_NOME  = 'bairro';           // campo do GeoJSON com o nome do bairro
const APELIDOS    = {                   // 'nome na planilha': 'nome no GeoJSON'
  'Duarte Silveira': 'DUARTE DA SILVEIRA',
};
/* ========================= */

const norm = s => String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const areaAnel = r => { let a=0; for(let i=0;i<r.length-1;i++) a+=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1]; return a/2; };
function centroide(r){            // devolve [lat, lng]
  let A=0,cx=0,cy=0;
  for(let i=0;i<r.length-1;i++){const c=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];A+=c;cx+=(r[i][0]+r[i+1][0])*c;cy+=(r[i][1]+r[i+1][1])*c}
  A/=2; return A ? [cy/(6*A), cx/(6*A)] : [r[0][1], r[0][0]];
}
function agrupar(g, D){
  const idx = new Map(D.map(d=>[norm(APELIDOS[d.nome]||d.nome), d]));
  const grupos = new Map();
  g.features.forEach(f=>{                       // o GeoJSON tem 1 linha por local de votação
    if(!f.geometry) return;
    const nome = f.properties[CAMPO_NOME], k = norm(nome);
    if(!grupos.has(k)) grupos.set(k,{nome, d: idx.get(k)||null, seen:new Set(), polys:[]});
    const gr = grupos.get(k);
    const polys = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    const chave = JSON.stringify(polys);
    if(gr.seen.has(chave)) return;              // mesma geometria repetida
    gr.seen.add(chave); gr.polys.push(...polys);
  });
  const F = [...grupos.values()];
  F.forEach(gr=>{
    let best=null, ba=-1;
    gr.polys.forEach(p=>{const a=Math.abs(areaAnel(p[0])); if(a>ba){ba=a;best=p}});
    gr.pos = centroide(best[0]);
    if(gr.d) gr.d.pos = gr.pos;
  });
  // bairros da planilha sem polígono: usa a média dos locais de votação
  const soma = new Map();
  g.features.forEach(f=>{
    const d = idx.get(norm(f.properties.BAIRRO_LOC));
    if(!d || d.pos) return;
    const la=parseFloat(f.properties.LATITUDE), lo=parseFloat(f.properties.LONGITUDE);
    if(isNaN(la)||isNaN(lo)) return;
    const s = soma.get(d)||{la:0,lo:0,n:0}; s.la+=la; s.lo+=lo; s.n++; soma.set(d,s);
  });
  soma.forEach((s,d)=>{ d.pos=[s.la/s.n, s.lo/s.n]; d.aprox=true; });
  return F;
}

const $ = id => document.getElementById(id);
const nf = x => x.toLocaleString('pt-BR');
const pc = x => (x*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const pp = x => (x>=0?'+':'−')+Math.abs(x*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+' p.p.';
const MEIO=[242,245,252], AZUL=[47,91,255], VERM=[255,59,78], ABS0=[255,236,214], ABS1=[255,122,26], TINTA=[11,27,58];
const lerp=(a,b,t)=>{t=Math.max(0,Math.min(1,t));return a.map((v,i)=>v+(b[i]-v)*t)};
const rgb=a=>`rgb(${a.map(Math.round).join(',')})`;
const OPC_TAM=[['tot','Votos'],['a','Abstenções']];
const OPC_COR=[['share','Flávio vs. média'],['vant','Vantagem em votos'],['abst','Abstenção']];
const TIT_TAM={tot:'Tamanho: votos computados',a:'Tamanho: abstenções'};

let D=[], F=[], T=null, CID=null, sel=null, met='share', tam='tot', mapa, camPoly, camBol, anim=0;

/* ---------- mapa base (Esri, sem chave de API) ---------- */
function iniciarMapa(){
  mapa = L.map('mapa',{zoomControl:true, maxZoom:19}).setView([-22.5,-43.18],11);
  const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  const cinza = L.layerGroup([
    L.tileLayer(esri+'Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      {maxNativeZoom:16, maxZoom:19, attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'}),
    L.tileLayer(esri+'Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
      {maxNativeZoom:16, maxZoom:19})
  ]).addTo(mapa);
  const satelite = L.layerGroup([
    L.tileLayer(esri+'World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxNativeZoom:19, maxZoom:19, attribution:'Tiles &copy; Esri &mdash; Maxar, Earthstar Geographics'}),
    L.tileLayer(esri+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      {maxNativeZoom:19, maxZoom:19})
  ]);
  camPoly = L.featureGroup().addTo(mapa);
  camBol  = L.featureGroup().addTo(mapa);
  L.control.layers({'Cinza claro':cinza,'Satélite':satelite},
                   {'Limites dos bairros':camPoly,'Bolhas de votos':camBol},{collapsed:true}).addTo(mapa);
  mapa.on('overlayadd',ordenarBolhas);
}

/* ---------- dados ---------- */
async function carregar(){
  try{
    iniciarMapa();
    const [g, xb] = await Promise.all([
      fetch(encodeURI(ARQ_GEOJSON)).then(r=>{if(!r.ok)throw new Error(ARQ_GEOJSON);return r.json()}),
      fetch(encodeURI(ARQ_XLSX)).then(r=>{if(!r.ok)throw new Error(ARQ_XLSX);return r.arrayBuffer()})
    ]);
    lerPlanilha(xb);
    F = agrupar(g, D);
    construirCamadas();
    totais(); avisos();
    atualizar(); detalhe();
  }catch(e){
    $('nota').className='nota err';
    $('nota').textContent='Não consegui carregar "'+e.message+'". Confira o nome do arquivo e abra a página pelo GitHub Pages ou por um servidor local.';
    console.error(e);
  }
}

const sum = k => D.reduce((s,d)=>s+d[k],0);
function lerPlanilha(buf){
  const wb = XLSX.read(buf), ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const h = rows.findIndex(r=>r && norm(r[0])==='BAIRRO');
  if(h<0) throw new Error(ARQ_XLSX+' (cabeçalho "Bairro" não encontrado)');
  const t = h>0 ? rows[h-1].slice(1,7) : null;
  if(t && t.every(v=>typeof v==='number')) T=t;
  D = rows.slice(h+1).filter(r=>r[0] && typeof r[1]==='number').map(r=>{
    const d={nome:String(r[0]).trim(),f:r[1],l:r[2],b:r[4],nu:r[5],a:r[6]};
    d.vant=d.f-d.l; d.v=d.f+d.l; d.tot=d.v+d.b+d.nu; d.share=d.f/d.v; d.abst=d.a/(d.tot+d.a);
    return d;
  });
  if(!T) T=[sum('f'),sum('l'),sum('f')-sum('l'),sum('b'),sum('nu'),sum('a')];
  const c={nome:'Petrópolis',f:T[0],l:T[1],b:T[3],nu:T[4],a:T[5]};
  c.vant=c.f-c.l; c.v=c.f+c.l; c.tot=c.v+c.b+c.nu; c.share=c.f/c.v; c.abst=c.a/(c.tot+c.a);
  CID=c;
}

const popup = d => `<div class="pp"><h3>${d.nome}</h3>
  <div class="vs"><i class="a" style="width:${d.share*100}%"></i><i class="b"></i></div>
  <div class="pr"><span class="azul">Flávio <b>${nf(d.f)}</b> · ${pc(d.share)}</span><span class="verm">Lula <b>${nf(d.l)}</b> · ${pc(1-d.share)}</span></div></div>`;
const dica = d => `<b>${d.nome}</b> · Flávio ${pc(d.share)} · Lula ${pc(1-d.share)}`;

function construirCamadas(){
  const feats = F.map((gr,i)=>({type:'Feature',properties:{i},geometry:{type:'MultiPolygon',coordinates:gr.polys}}));
  L.geoJSON({type:'FeatureCollection',features:feats},{
    onEachFeature:(f,layer)=>{
      const gr = F[f.properties.i]; gr.layer = layer;
      camPoly.addLayer(layer);
      if(gr.d){
        layer.bindTooltip(()=>dica(gr.d),{sticky:true});
        layer.bindPopup(()=>popup(gr.d));
        layer.on('click',()=>escolher(gr.d,false));
      }else{
        layer.bindTooltip(gr.nome+' (sem dados)',{sticky:true});
      }
    }
  });
  D.forEach(d=>{
    if(!d.pos) return;
    d.bol = L.circleMarker(d.pos,{radius:8,weight:1.5,color:'#0b1b3a',fillColor:'#0b1b3a',fillOpacity:.16});
    d.bol.bindTooltip(()=>dica(d)+(d.aprox?' · posição aproximada':''));
    d.bol.bindPopup(()=>popup(d));
    d.bol.on('click',()=>escolher(d,false));
    camBol.addLayer(d.bol);
  });
  if(camPoly.getLayers().length) mapa.fitBounds(camPoly.getBounds(),{padding:[10,10]});
  setTimeout(()=>mapa.invalidateSize(),200);
}

function totais(){
  $('tot').innerHTML = [['Flávio Bolsonaro',T[0],'f'],['Lula',T[1],'l'],['Diferença',T[0]-T[1],''],['Brancos',T[3],''],['Nulos',T[4],''],['Abstenções',T[5],'']]
    .map(c=>`<div class="kpi ${c[2]}"><b>${nf(c[1])}</b><span>${c[0]}</span></div>`).join('');
}
function avisos(){
  const com = new Set(F.filter(f=>f.d).map(f=>f.d));
  const sem = D.filter(d=>!com.has(d)), semPos = D.filter(d=>!d.pos);
  $('nota').className='nota';
  $('nota').textContent = sem.length
    ? `Sem polígono próprio (bolha no local de votação): ${sem.filter(d=>d.pos).map(d=>d.nome).join(', ')||'nenhum'}.`
      + (semPos.length ? ` Sem posição no mapa (só na lista): ${semPos.map(d=>d.nome).join(', ')}.` : '')
    : '';
}

/* ---------- cores e tamanhos ---------- */
function escala(){
  const v=D.map(d=>d[met]);
  if(met==='share'){                      // centrada na média da cidade
    const c=CID.share, m=Math.max(...v.map(x=>Math.abs(x-c)))||.01;
    return {cor:x=>{const t=(x-c)/m;return t>=0?lerp(MEIO,AZUL,t):lerp(MEIO,VERM,-t)}, lo:c-m, hi:c+m, centro:c,
            grad:`linear-gradient(90deg,${rgb(VERM)},${rgb(MEIO)},${rgb(AZUL)})`,
            titulo:'Flávio contra a média da cidade'};
  }
  if(met==='vant'){
    const lo=Math.min(0,...v), hi=Math.max(0,...v);
    return {cor:x=>x>=0?lerp(MEIO,AZUL,x/(hi||1)):lerp(MEIO,VERM,x/(lo||-1)), lo, hi,
            grad:`linear-gradient(90deg,${lo<0?rgb(VERM)+',':''}${rgb(MEIO)},${rgb(AZUL)})`,
            titulo:'Vantagem do Flávio sobre o Lula (votos)'};
  }
  const mn=Math.min(...v), mx=Math.max(...v);
  return {cor:x=>lerp(ABS0,ABS1,(x-mn)/(mx-mn||1)), lo:mn, hi:mx,
          grad:`linear-gradient(90deg,${rgb(ABS0)},${rgb(ABS1)})`, titulo:'% de abstenção'};
}
const fmt = x => (met==='share'||met==='abst') ? pc(x) : nf(Math.round(x));
const raio = (v,max) => 3 + 21*Math.sqrt(Math.abs(v)/max);
const ordenarBolhas = () => D.filter(d=>d.bol).sort((a,b)=>b.bol.getRadius()-a.bol.getRadius()).forEach(d=>d.bol.bringToFront());

function animar(itens){
  cancelAnimationFrame(anim);
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 380, ini = performance.now();
  itens.forEach(i=>{ i.r0 = i.el._r ?? i.r1; i.c0 = i.el._c || i.c1; i.el.setStyle(i.estilo); });
  const passo = agora=>{
    const t = dur ? Math.min(1,(agora-ini)/dur) : 1, e = 1-Math.pow(1-t,3);
    itens.forEach(i=>{
      if(i.c1){ const c = i.c0.map((v,k)=>v+(i.c1[k]-v)*e); i.el._c=c; i.el.setStyle({fillColor:rgb(c)}); }
      if(i.r1!=null){ i.el._r = i.r0+(i.r1-i.r0)*e; i.el.setRadius(i.el._r); }
    });
    if(t<1) anim=requestAnimationFrame(passo); else ordenarBolhas();
  };
  anim = requestAnimationFrame(passo);
}

function legendaTamanho(max){
  const ref=[1,.5,.125].map(f=>{const v=max*f; return v>1000?Math.round(v/100)*100:Math.round(v)});
  $('lst').textContent = TIT_TAM[tam];
  $('lsz').innerHTML = [1,.5,.125].map((f,i)=>{const r=raio(max*f,max);
    return `<div><i style="width:${2*r}px;height:${2*r}px"></i><span>${nf(ref[i])}</span></div>`}).join('');
}

function atualizar(){
  const s=escala(), q=norm($('q').value), max=Math.max(...D.map(d=>Math.abs(d[tam])))||1;
  const vis = d => !q || norm(d.nome).includes(q);
  const itens=[];
  F.forEach(gr=>{
    if(!gr.layer) return;
    if(!gr.d){ gr.layer.setStyle({color:'#aab4c8',weight:1,fillColor:'#dfe5f0',fillOpacity:.25}); return; }
    const on=vis(gr.d), isSel=gr.d===sel;
    itens.push({el:gr.layer, c1:s.cor(gr.d[met]),
      estilo:{color:isSel?'#0b1b3a':'rgba(11,27,58,.5)', weight:isSel?3:1.2, opacity:on?1:.25, fillOpacity:on?.55:.07}});
  });
  D.forEach(d=>{
    if(!d.bol) return;
    const on=vis(d), isSel=d===sel;
    itens.push({el:d.bol, r1:raio(d[tam],max),
      estilo:{color:isSel?'#0b1b3a':'rgba(11,27,58,.75)', weight:isSel?3:1.5, opacity:on?1:.2, fillColor:'#0b1b3a', fillOpacity:on?(isSel?.3:.16):.04}});
  });
  animar(itens);
  $('lt').textContent = s.titulo;
  $('lmin').textContent=fmt(s.lo); $('lmax').textContent=fmt(s.hi);
  $('lmid').textContent = s.centro!=null ? 'média '+fmt(s.centro) : '';
  $('lbar').style.background=s.grad;
  legendaTamanho(max);
  const L2=[...D].sort((a,b)=>b[met]-a[met]).filter(vis);
  $('list').innerHTML=L2.map(d=>{
    const p=Math.max(4,(d[met]-s.lo)/((s.hi-s.lo)||1)*100);
    return `<div class="it${d===sel?' sel':''}" tabindex="0" data-n="${D.indexOf(d)}"><span>${d.nome}</span><em>${fmt(d[met])}</em><b style="width:calc(${p}% - 12px);background:${rgb(s.cor(d[met]))}"></b></div>`;
  }).join('');
}

function detalhe(){
  const el=$('det'), d=sel||CID, f=d.f>=d.l;
  el.innerHTML=`<div class="dh"><h2>${d.nome}</h2><span class="tag ${f?'f':'l'}">${f?'Flávio':'Lula'} +${nf(Math.abs(d.vant))}</span></div>
  <div class="duelo"><div><b class="azul">${pc(d.share)}</b><span>Flávio · ${nf(d.f)}</span></div><div><b class="verm">${pc(1-d.share)}</b><span>Lula · ${nf(d.l)}</span></div></div>
  <div class="vs"><i class="a" style="width:50%"></i><i class="b"></i></div>
  ${sel?`<p class="cmp"><b>${pp(d.share-CID.share)}</b> para o Flávio em relação à média da cidade (${pc(CID.share)}).</p>`:''}
  <div class="stats"><div><b>${nf(d.b)}</b><span>Brancos</span></div><div><b>${nf(d.nu)}</b><span>Nulos</span></div><div><b>${pc(d.abst)}</b><span>Abstenção (${nf(d.a)})</span></div></div>
  <p class="nota" style="margin-left:0">Percentuais calculados entre Flávio e Lula.${sel&&!d.pos?' Este bairro não tem posição no mapa.':''}</p>
  ${sel?'<button class="link" id="limpar" type="button">Voltar para a cidade toda</button>':'<p class="nota" style="margin-left:0">Clique num bairro, numa bolha ou na lista para comparar.</p>'}`;
  const l=$('limpar'); if(l) l.onclick=()=>{sel=null;mapa.closePopup();atualizar();detalhe()};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=el.querySelector('.vs .a'); if(a) a.style.width=(d.share*100)+'%';}));
}

function escolher(d, voar=true){
  sel=d; atualizar(); detalhe();
  if(!voar) return;
  if(d.bol){ mapa.flyTo(d.pos,Math.max(mapa.getZoom(),13),{duration:.6}); d.bol.openPopup(); }
  else{
    const gr=F.find(f=>f.d===d);
    if(gr&&gr.layer){ mapa.fitBounds(gr.layer.getBounds(),{maxZoom:14}); gr.layer.openPopup(); }
  }
}

function pills(id, ops, get, set){
  const el=$(id);
  el.innerHTML=ops.map(([k,t])=>`<button type="button" class="pill" data-k="${k}">${t}</button>`).join('');
  const marcar=()=>[...el.children].forEach(b=>{const on=b.dataset.k===get();b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  el.onclick=e=>{const b=e.target.closest('button'); if(b){set(b.dataset.k);marcar()}};
  marcar();
}
pills('pTam',OPC_TAM,()=>tam,k=>{tam=k;atualizar()});
pills('pCor',OPC_COR,()=>met,k=>{met=k;atualizar()});
$('list').addEventListener('click',e=>{const t=e.target.closest('.it');if(t)escolher(D[+t.dataset.n])});
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.closest('.it');if(t)escolher(D[+t.dataset.n])}});
$('q').oninput=atualizar;
$('ver').onclick=()=>{ if(camPoly.getLayers().length) mapa.fitBounds(camPoly.getBounds(),{padding:[10,10]}) };
carregar();
</script>
</body>
</html>
